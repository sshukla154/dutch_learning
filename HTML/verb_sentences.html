            { no: 100, english: "I relax at home.", dutch: "Ik ontspan thuis.", pronunciation: "ik ont-spahn towss", verb: "ontspannen", noun: "thuis" }
        ];
        
        function populateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            sentences.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="no-cell">${item.no}</td>
                    <td class="english-cell">${item.english}</td>
                    <td class="dutch-cell">
                        <button class="reveal-btn" onclick="toggleReveal(${index}, 'dutch')">Click to reveal</button>
                        <div class="hidden-text" id="dutch-${index}">${item.dutch}</div>
                    </td>
                    <td>
                        <button class="reveal-btn" onclick="toggleReveal(${index}, 'pronunciation')">Click to reveal</button>
                        <div class="pronunciation-text" id="pronunciation-${index}">${item.pronunciation}</div>
                    </td>
                    <td>
                        <button class="speak-btn" onclick="speak('${item.dutch.replace(/'/g, "\\'")}')">
                            🔊 Listen
                        </button>
                    </td>
                    <td class="verb-cell">${item.verb}</td>
                    <td class="noun-cell">${item.noun}</td>
                `;
                tbody.appendChild(row);
            });
            
            updateStats();
        }
        
        function toggleReveal(index, type) {
            const element = document.getElementById(`${type}-${index}`);
            const button = element.previousElementSibling;
            
            if (element.classList.contains('revealed')) {
                element.classList.remove('revealed');
                button.textContent = 'Click to reveal';
                button.classList.remove('revealed');
            } else {
                element.classList.add('revealed');
                button.textContent = 'Hide';
                button.classList.add('revealed');
            }
        }
        
        function revealAll() {
            sentences.forEach((item, index) => {
                const element = document.getElementById(`dutch-${index}`);
                const button = element.previousElementSibling;
                element.classList.add('revealed');
                button.textContent = 'Hide';
                button.classList.add('revealed');
            });
        }
        
        function hideAll() {
            sentences.forEach((item, index) => {
                const element = document.getElementById(`dutch-${index}`);
                const button = element.previousElementSibling;
                element.classList.remove('revealed');
                button.textContent = 'Click to reveal';
                button.classList.remove('revealed');
            });
        }
        
        function revealAllPronunciation() {
            sentences.forEach((item, index) => {
                const element = document.getElementById(`pronunciation-${index}`);
                const button = element.previousElementSibling;
                element.classList.add('revealed');
                button.textContent = 'Hide';
                button.classList.add('revealed');
            });
        }
        
        function hideAllPronunciation() {
            sentences.forEach((item, index) => {
                const element = document.getElementById(`pronunciation-${index}`);
                const button = element.previousElementSibling;
                element.classList.remove('revealed');
                button.textContent = 'Click to reveal';
                button.classList.remove('revealed');
            });
        }
        
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'nl-NL'; // Dutch language
                utterance.rate = 0.8; // Slower for learning
                utterance.pitch = 1;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Sorry, your browser does not support text-to-speech.');
            }
        }
        
        function searchTable() {
            const input = document.getElementById('searchBox');
            const filter = input.value.toLowerCase();
            const table = document.getElementById('sentenceTable');
            const rows = table.getElementsByTagName('tr');
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const cells = row.getElementsByTagName('td');
                let found = false;
                
                for (let j = 0; j < cells.length; j++) {
                    const cell = cells[j];
                    if (cell) {
                        const textValue = cell.textContent || cell.innerText;
                        if (textValue.toLowerCase().indexOf(filter) > -1) {
                            found = true;
                            break;
                        }
                    }
                }
                
                row.style.display = found ? '' : 'none';
            }
        }
        
        function updateStats() {
            const uniqueVerbs = new Set(sentences.map(s => s.verb)).size;
            document.getElementById('stats').textContent = 
                `Total Sentences: ${sentences.length} | Unique Verbs: ${uniqueVerbs}`;
        }
        
        // Initialize table on page load
        window.onload = populateTable;
    </script>
</body>
</html>
