                    <td>
                        <button class="speak-btn" onclick="speak('${sentence.dutch.replace(/'/g, "\\'")}')">
                            <span class="speaker-icon">🔊</span> Speak
                        </button>
                    </td>
                    <td>
                        <span class="noun-badge">${sentence.noun}</span>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function toggleReveal(rowNo, type) {
            const content = document.getElementById(`${type}-${rowNo}`);
            const button = content.previousElementSibling;
            
            if (content.classList.contains('visible')) {
                content.classList.remove('visible');
                button.textContent = 'Click to Reveal';
                button.classList.remove('revealed');
                revealedRows.delete(`${rowNo}-${type}`);
            } else {
                content.classList.add('visible');
                button.textContent = 'Hide';
                button.classList.add('revealed');
                revealedRows.add(`${rowNo}-${type}`);
            }
            
            updateProgress();
        }
        
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'nl-NL';
                utterance.rate = 0.8;
                utterance.pitch = 1;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Speech synthesis is not supported in your browser.');
            }
        }
        
        function revealAll() {
            sentences.forEach(sentence => {
                const dutchContent = document.getElementById(`dutch-${sentence.no}`);
                const pronContent = document.getElementById(`pronunciation-${sentence.no}`);
                const dutchButton = dutchContent.previousElementSibling;
                const pronButton = pronContent.previousElementSibling;
                
                dutchContent.classList.add('visible');
                pronContent.classList.add('visible');
                dutchButton.textContent = 'Hide';
                pronButton.textContent = 'Hide';
                dutchButton.classList.add('revealed');
                pronButton.classList.add('revealed');
                
                revealedRows.add(`${sentence.no}-dutch`);
                revealedRows.add(`${sentence.no}-pronunciation`);
            });
            
            updateProgress();
        }
        
        function hideAll() {
            sentences.forEach(sentence => {
                const dutchContent = document.getElementById(`dutch-${sentence.no}`);
                const pronContent = document.getElementById(`pronunciation-${sentence.no}`);
                const dutchButton = dutchContent.previousElementSibling;
                const pronButton = pronContent.previousElementSibling;
                
                dutchContent.classList.remove('visible');
                pronContent.classList.remove('visible');
                dutchButton.textContent = 'Click to Reveal';
                pronButton.textContent = 'Click to Reveal';
                dutchButton.classList.remove('revealed');
                pronButton.classList.remove('revealed');
            });
            
            revealedRows.clear();
            updateProgress();
        }
        
        function resetProgress() {
            if (confirm('Are you sure you want to reset your progress?')) {
                hideAll();
            }
        }
        
        function updateProgress() {
            const totalPossible = sentences.length * 2; // Dutch + Pronunciation for each sentence
            const revealed = revealedRows.size;
            const percentage = Math.round((revealed / totalPossible) * 100);
            
            document.getElementById('revealedCount').textContent = Math.floor(revealed / 2);
            document.getElementById('progressPercent').textContent = percentage + '%';
            document.getElementById('progressFill').style.width = percentage + '%';
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            
            rows.forEach(row => {
                const english = row.cells[1].textContent.toLowerCase();
                const dutchContent = row.querySelector('.dutch-text');
                const dutch = dutchContent ? dutchContent.textContent.toLowerCase() : '';
                const noun = row.cells[5].textContent.toLowerCase();
                
                if (english.includes(searchTerm) || dutch.includes(searchTerm) || noun.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
        
        // Initialize table on page load
        generateTable();
    </script>
</body>
</html>
