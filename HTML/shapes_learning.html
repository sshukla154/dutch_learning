<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<script src="assets/nl-theme-init.js"></script>
<title>Vormen — Nederlands leren</title>
<link rel="stylesheet" href="assets/nl-tokens.css">
<link rel="stylesheet" href="assets/nl-theme.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="s-circle" viewBox="0 0 100 100"><circle class="shape-fill" cx="50" cy="50" r="40"/></symbol>
  <symbol id="s-square" viewBox="0 0 100 100"><rect class="shape-fill" x="15" y="15" width="70" height="70"/></symbol>
  <symbol id="s-triangle" viewBox="0 0 100 100"><polygon class="shape-fill" points="50,15 85,75 15,75"/></symbol>
  <symbol id="s-rectangle" viewBox="0 0 100 100"><rect class="shape-fill" x="10" y="25" width="80" height="50"/></symbol>
  <symbol id="s-oval" viewBox="0 0 100 100"><ellipse class="shape-fill" cx="50" cy="50" rx="40" ry="25"/></symbol>
  <symbol id="s-pentagon" viewBox="0 0 100 100"><polygon class="shape-fill" points="50,10 75,40 60,75 40,75 25,40"/></symbol>
  <symbol id="s-hexagon" viewBox="0 0 100 100"><polygon class="shape-fill" points="50,10 70,30 70,60 50,80 30,60 30,30"/></symbol>
  <symbol id="s-octagon" viewBox="0 0 100 100"><polygon class="shape-fill" points="50,10 65,25 80,25 80,40 95,50 80,60 80,75 65,75 50,90 35,75 20,75 20,60 5,50 20,40 20,25 35,25"/></symbol>
  <symbol id="s-diamond" viewBox="0 0 100 100"><polygon class="shape-fill" points="50,20 70,40 60,70 40,70 30,40"/></symbol>
  <symbol id="s-star" viewBox="0 0 100 100"><path class="shape-fill" d="M 50,15 L 60,35 L 82,35 L 65,50 L 72,70 L 50,58 L 28,70 L 35,50 L 18,35 L 40,35 Z"/></symbol>
  <symbol id="s-heart" viewBox="0 0 100 100"><path class="shape-fill" d="M 50,20 Q 80,50 50,80 Q 20,50 50,20"/></symbol>
  <symbol id="s-straight-line" viewBox="0 0 100 100"><line class="shape-line" x1="15" y1="50" x2="85" y2="50"/></symbol>
  <symbol id="s-curved-line" viewBox="0 0 100 100"><path class="shape-line" d="M 15,75 Q 50,15 85,75"/></symbol>
  <symbol id="s-crescent" viewBox="0 0 100 100"><path class="shape-line" d="M 50,20 A 30,30 0 1,1 50,80"/></symbol>
  <symbol id="s-ring" viewBox="0 0 100 100"><circle class="shape-line" cx="50" cy="50" r="35"/></symbol>
  <symbol id="s-rounded-square" viewBox="0 0 100 100"><rect class="shape-fill" x="20" y="20" width="60" height="60" rx="15"/></symbol>
  <symbol id="s-rhombus" viewBox="0 0 100 100"><polygon class="shape-fill" points="30,50 50,20 70,50 50,80"/></symbol>
  <symbol id="s-arrow" viewBox="0 0 100 100"><polygon class="shape-fill" points="30,60 50,15 70,60 85,80 15,80"/></symbol>
  <symbol id="s-hollow-square" viewBox="0 0 100 100"><rect class="shape-line" x="30" y="30" width="40" height="40"/></symbol>
  <symbol id="s-house-shape" viewBox="0 0 100 100"><rect class="shape-fill" x="25" y="50" width="50" height="35"/><polygon class="shape-fill" points="25,50 50,20 75,50"/></symbol>
</svg>
<main class="frame" id="app">
  <noscript><p class="empty">Deze pagina heeft JavaScript nodig om de les te tonen.</p></noscript>
</main>

<script src="data/shapes_learning.js"></script>
<script src="assets/nl-core.js"></script>
<script src="assets/nl-page.js"></script>
</body>
</html>
